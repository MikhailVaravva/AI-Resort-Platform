knx:
  switch:
  - name: Audio Power
    address: 1/1/202
    state_address: 1/1/203
  - name: Audio Mute
    address: 1/1/220
  - name: Audio Play/Pause
    address: 1/1/222
  light:
  - name: Audio Absolut volume
    address: 1/1/202
    brightness_address: 1/1/211
    entity_category: config
  button:
  - name: Audio Next/Prev
    address: 1/1/226
  - name: Audio Previous
    address: 1/1/226
    payload: '0'
  sensor:
  - name: Audio Track name
    type: latin_1
    state_address: 1/1/231
  number:
  - name: Audio Playlist Select
    address: 1/1/239
    type: 1byte_unsigned
template:
- sensor:
  - name: Villa A1 Audio Volume
    unique_id: villa_a1_audio_volume
    state: '{{ [0.0, [1.0, (state_attr(''light.audio_absolut_volume'', ''brightness'')
      | float(0)) / 255] | min] | max }}'
