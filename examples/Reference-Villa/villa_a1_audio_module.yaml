knx:
  switch:
  - name: Audio Power
    address: 1/1/202
    state_address: 1/1/203
  - name: Audio Mute
    address: 1/1/220
  - name: Audio Play/Pause
    address: 1/1/222
  - name: Audio Next/Prev
    address: 1/1/226
  sensor:
  - name: Audio Absolut volume
    type: percent
    state_address: 1/1/211
  - name: Audio Track name
    type: latin_1
    state_address: 1/1/231
  - name: Audio Playlist Select
    type: 1byte_unsigned
    state_address: 1/1/239
