# Villa A1, built from the resort project rather than a single-villa
# export. The two describe the same villa; this one is the source of
# truth for the whole complex, so a change made in ETS reaches every
# villa's package from one file.
#
#   ai-resort-platform build deployments/hot_stone_villa_a1.toml

[project]
path = "../examples/Hot-Stone/hot_stone.knxproj"
password_env = "HOT_STONE_KNXPROJ_PASSWORD"
# Which room to build. Without it the package would describe all twelve
# villas at once - see villa_group_addresses.
villa = "Villa A1"

[package]
welcome_playlist = 1
background_playlist = 2
audio_media_source = "media_player.192_168_1_147"

# This installation reports on change and answers no read.
#
# The earlier measurement could only speak for the audio module, since the
# rest of the bus was not physically connected then. It is now. On 14
# August, over a tunnel through the CubeVision gateway (our address
# 1.1.209), five of Villa A1's six devices answered a point-to-point
# address check - binary input, actuator, DALI gateway, Touch S3 and the
# audio module - so they are present and awake. All 25 of the villa's
# status addresses were then read, and exactly one answered: 1/1/170
# DMX Terrace Dimming.
#
# Polling therefore costs about a hundred two-second timeouts on every
# restart and buys one value. Home Assistant learns the rest when a device
# sends it, which is what these devices do.
answers_read_requests = false

[output]
package = "../homeassistant/packages/villa_a1.yaml"
dashboard = "../homeassistant/villa_a1_dashboard.yaml"
