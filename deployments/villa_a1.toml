# Villa A1 - what is actually deployed on the installation.
#
# Every option here changes the generated output, and every one of them
# was learned from the running system rather than derived from the ETS
# project. Regenerating without them produces a package that looks fine
# and has quietly lost the media source, the check-in automation and the
# read suppression - so they live here instead of in someone's shell
# history.
#
#   ai-resort-platform build deployments/villa_a1.toml

[project]
# The installation's own ETS project, now in the repository so a checkout
# can build the villa without the machine it was exported on. Not the
# reference project under examples/Reference-Villa: that is a different,
# older one (Hot Stone VILLA) without the audio module's equalizer or
# source addresses.
path = "../examples/Villa-A1/villa_a1.knxproj"
# Read at build time from the environment. Deliberately not a value: this
# file is in version control and the password is not.
password_env = "VILLA_A1_KNXPROJ_PASSWORD"

[package]
# Playlist indices for check-in: the welcome playlist, then the
# background one after the delay. Raw indices because nothing in ETS maps
# a playlist name to a number - see _build_welcome_automation.
welcome_playlist = 1
background_playlist = 2

# The Logitech Media Server running on the audio module itself, reached
# through Home Assistant's squeezebox integration. Supplies artwork,
# artist and album, which KNX cannot carry at all - its longest string is
# a 14-character EIS15.
audio_media_source = "media_player.192_168_1_17"

# Group addresses the audio module itself reports on but never answers a
# read for. This is a property of the module, measured over 1475 incoming
# telegrams and not one GroupValueResponse - it sends on change and
# responds to no poll.
#
# Deliberately NOT extended to the rest of the installation. An earlier
# version here said `answers_read_requests = false` for the whole bus,
# on the strength of 2342 unanswered reads and a read from ETS that also
# went unanswered. Both measurements were real and the conclusion was
# wrong: at the time the only device physically on the bus was the audio
# module. Everything else - the Dali gateway, the actuator, the touch
# panel, the DMX module - was simply not connected, so of course nothing
# answered. Whether those devices answer a read is still unmeasured, and
# stating that they do not would quietly cost Home Assistant every state
# it could have had after a restart.
unresponsive_addresses = [
  "1/1/203", "1/1/212", "1/1/221", "1/1/223", "1/1/231",
]

[output]
package = "../homeassistant/packages/villa_a1.yaml"
dashboard = "../homeassistant/villa_a1_dashboard.yaml"
